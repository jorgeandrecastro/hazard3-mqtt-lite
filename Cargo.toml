[package]
name          = "hazard3-mqtt-lite"
version       = "0.4.0"
edition       = "2024"
authors       = ["Jorge Andre Castro <georgeandrec@gmail.com>"]
license       = "GPL-2.0-or-later"
description   = """Minimal asynchronous no_std MQTT v3.1.1 client for Hazard3. Supports QoS 0, authentication, Last Will, keep-alive, subscriptions and optional TLS 1.3. Works with any transport implementing embedded_io_async::Read + Write."""
repository    = "https://github.com/jorgeandrecastro/embassy-mqtt-lite"
readme        = "README.md"
keywords      = ["mqtt", "hazard3", "no-std", "embedded", "tls"]
categories    = ["embedded", "no-std", "network-programming"]

build        = false
autolib      = false
autobins     = false
autoexamples = false
autotests    = false
autobenches  = false

[lib]
name = "hazard3_mqtt_lite"
path = "src/lib.rs"

[dependencies]
embedded-io-async = "0.7"
embedded-tls      = { version = "0.19", default-features = false, features = ["rustpki"], optional = true }

[dev-dependencies]
embassy-futures = "0.1"

[features]
default     = []
# TLS 1.3, server certificate verified against a pinned CA (ECDSA P-256).
tls         = ["dep:embedded-tls"]
# ECDSA P-384 / Ed25519 certificate chains in addition to P-256.
tls-p384    = ["tls", "embedded-tls/p384"]
tls-ed25519 = ["tls", "embedded-tls/ed25519"]

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true